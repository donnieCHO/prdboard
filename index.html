<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PRD 과제 제출함</title>
<link rel="stylesheet" href="css/style.css">
<script src="data/prds.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="wall" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

<header class="hero">
  <h1>PRD 과제 제출함</h1>
  <p>전남창의융합교육원 교원 AI 연수 1일차에 선생님들이 직접 기획한 서비스 설계서입니다. 과제를 골라 원문을 읽고, 좋아요와 덧글을 남기거나 팀으로 참여해 보세요.</p>
  <div class="hero-row">
    <span class="pill glass" id="tally"></span>
    <a class="submit" href="https://drive.google.com/drive/folders/1JmNoUntASQSWndueDdUE4iOboOQl8cCE" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>PRD 제출하기 <small>Google 드라이브</small></a>
  </div>
  <p class="notice glass" id="offline" hidden>좋아요·덧글·팀 참여는 아직 연결 전입니다. 지금은 원문만 볼 수 있습니다.</p>
</header>

<main><section class="grid" id="grid" aria-live="polite"></section></main>

<nav class="dock glass" aria-label="과제 찾기">
  <div class="seg" id="filter" role="group" aria-label="대상별로 보기">
    <span class="thumb" aria-hidden="true"></span>
    <button data-f="all" aria-pressed="true">전체</button>
    <button data-f="교사" aria-pressed="false">교사용</button>
    <button data-f="학생" aria-pressed="false">학생용</button>
  </div>
  <label class="find">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="학교, 이름, 서비스로 찾기" autocomplete="off" aria-label="찾기">
  </label>
</nav>

<div class="viewer" id="viewer" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="vtitle">
    <div class="grab" aria-hidden="true"></div>
    <div class="bar">
      <div class="t"><b id="vtitle"></b><span id="vwho"></span></div>
      <div class="seg tabs" id="tabs" role="tablist" aria-label="보기 전환">
        <span class="thumb" aria-hidden="true"></span>
        <button role="tab" data-tab="doc" aria-selected="true">원문</button>
        <button role="tab" data-tab="comments" aria-selected="false" id="tabComments">덧글</button>
        <button role="tab" data-tab="team" aria-selected="false">팀</button>
      </div>
      <button class="chipbtn" id="vlike" aria-label="좋아요"></button>
      <button class="round" id="vprint" aria-label="원문 인쇄"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg></button>
      <button class="round" id="vclose" aria-label="닫기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="paper" id="paper">
      <section class="pane" id="pane-doc" role="tabpanel"><article class="doc" id="vdoc"></article></section>
      <section class="pane" id="pane-comments" role="tabpanel" hidden></section>
      <section class="pane" id="pane-team" role="tabpanel" hidden></section>
    </div>
  </div>
</div>
</body>
</html>
