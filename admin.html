<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>제출함 관리</title>
<link rel="stylesheet" href="css/style.css">
<script src="data/prds.js"></script>
<script type="module" src="js/admin.js"></script>
</head>
<body>
<div class="wall" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="admin">
  <h1>제출함 관리</h1>
  <p class="hint">PRD 과제 제출함의 작성자 비밀번호, 팀 만들기, 덧글을 관리합니다. <a href="index.html">제출함으로 돌아가기</a></p>

  <section class="panel glass" id="login">
    <p id="loginMsg" class="hint">관리자 Google 계정으로 로그인합니다.</p>
    <div class="actions" style="justify-content:flex-start;margin-top:12px">
      <button class="btn primary" id="btnLogin">Google로 로그인</button>
      <button class="btn" id="btnLogout" hidden>로그아웃</button>
    </div>
  </section>

  <div id="adminArea" hidden>
    <section class="panel glass">
      <div class="actions" style="justify-content:space-between">
        <h2 class="sec-title" style="margin:0">PRD별 현황</h2>
        <div class="actions">
          <button class="btn" id="btnRefresh">새로고침</button>
          <button class="btn" id="btnSeed">초기 데이터 만들기·갱신</button>
        </div>
      </div>
      <p class="hint" style="margin:8px 0 14px">처음 한 번 「초기 데이터 만들기·갱신」을 눌러야 제출함에서 팀 만들기가 열립니다. 이미 있는 팀 상태는 건드리지 않습니다.</p>
      <div class="tbl-wrap"><table class="tbl" id="tbl"></table></div>
    </section>

    <section class="panel glass">
      <h2 class="sec-title">덧글 관리</h2>
      <div class="row" style="max-width:520px">
        <select class="in" id="cmtPrd" aria-label="PRD 고르기"></select>
      </div>
      <div class="tbl-wrap" style="margin-top:12px"><table class="tbl" id="cmtTbl"></table></div>
    </section>

    <section class="panel glass">
      <h2 class="sec-title">작업 기록</h2>
      <div class="tbl-wrap"><table class="tbl" id="logTbl"></table></div>
    </section>
  </div>
</div>
</body>
</html>
